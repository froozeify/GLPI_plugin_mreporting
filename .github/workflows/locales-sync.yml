name: "Synchronize locales"

on:
  schedule:
    - cron: "0 0 * * 1-5"
  workflow_dispatch:

jobs:
  sync-with-transifex:
    name: "Sync with transifex"
    uses: "froozeify/GLPI_plugin-translation-workflows/.github/workflows/transifex-sync.yml@switch-to-core-tools"
    secrets:
      github-token: "${{ secrets.LOCALES_SYNC_TOKEN }}"
      transifex-token: "${{ secrets.TRANSIFEX_TOKEN }}"
